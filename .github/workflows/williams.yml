name: Williams R monitor

on:
  schedule:
    # co 15 min, pn-pt, 13:00-21:59 UTC (raport przed sesją + sesja USA, zimą i latem)
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:   # ręczne uruchomienie = natychmiastowy raport na żądanie

permissions:
  contents: write      # potrzebne do zapisu state.json

concurrency:
  group: williams
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python williams_check.py ${{ github.event_name == 'workflow_dispatch' && '--report' || '' }}

      - name: Save state
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git diff --cached --quiet || (git commit -m "update state" && git push)
          fi
